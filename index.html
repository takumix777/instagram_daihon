<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOODY HOUSE Reel Script Builder</title>
<style>
:root{--ink:#1d211d;--muted:#697068;--bg:#f4f1e9;--panel:#fff;--line:#ddd9cd;--brand:#203d31;--soft:#edf2ed;--warn:#fff2d9}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}
header{padding:26px 24px 18px;background:var(--brand);color:white}header h1{margin:0;font-size:25px}header p{margin:7px 0 0;opacity:.84;font-size:13px}
main{max-width:1320px;margin:0 auto;padding:20px;display:grid;grid-template-columns:400px 1fr;gap:18px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.03)}
h2{font-size:16px;margin:0 0 13px}h3{font-size:14px;margin:16px 0 9px}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font:inherit;color:inherit}
textarea{min-height:82px;resize:vertical}
button{border:0;border-radius:10px;padding:11px 13px;font-weight:800;cursor:pointer;background:#e8e8e2;color:var(--ink)}
button.primary{background:var(--brand);color:white;width:100%;font-size:15px;padding:14px}
button.secondary{background:#e9eee9}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{width:auto}
.muted{font-size:12px;color:var(--muted);line-height:1.6}.tiny{font-size:11px;color:var(--muted)}
.source{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;display:flex;gap:9px;align-items:flex-start}
.source input{width:auto;margin-top:3px}.source b{font-size:12px}.source p{margin:4px 0 0;font-size:11px;color:var(--muted);line-height:1.45}
.badge{display:inline-block;font-size:10px;padding:3px 6px;border-radius:999px;background:var(--soft);margin-right:5px}.warn{background:var(--warn)}
.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap}.tab.active{background:var(--brand);color:white}
.pane{display:none}.pane.active{display:block}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top;text-align:left}th{background:#f3f3ef;position:sticky;top:0}
.cut{font-weight:800;width:46px}.role{color:var(--muted);font-size:11px}
.box{background:#f5f6f2;border-radius:12px;padding:13px;white-space:pre-wrap;line-height:1.65;font-size:12px}
.verify{background:var(--warn);border-radius:12px;padding:12px;font-size:12px;line-height:1.6}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--soft);padding:7px 10px;border-radius:9px;font-size:11px}
.refrow{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.refrow:last-child{border:0}
</style>
</head>
<body>
<header>
  <h1>WOODY HOUSE Reel Script Builder</h1>
  <p>過去台本＝「伝え方」、Q&A・公式HP＝「事実」。テーマを入れて、リール台本のたたき台を半自動作成。</p>
</header>
<main>
<aside>
  <div class="card">
    <h2>台本を作る</h2>
    <label>テーマ *</label>
    <input id="theme" placeholder="例：土地探しで失敗しないために">
    <label>今回必ず入れたい内容</label>
    <textarea id="must" placeholder="例：土地が決まる前でも相談できる／現地調査で日当たりや法規制も見る"></textarea>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label>ターゲット</label><select id="target"><option>家づくり初心者</option><option>土地探し中</option><option>住宅ローンが不安</option><option>会社比較中</option><option>モデルハウス検討中</option><option>既存オーナー</option></select></div>
      <div><label>動画尺</label><select id="duration"><option value="15">約30秒</option><option value="18" selected>約40秒</option><option value="22">約50〜60秒</option></select></div>
    </div>
    <label>見せ方</label>
    <select id="angle">
      <option value="auto">おまかせ</option><option value="qa">Q&A型</option><option value="avoid">失敗回避型</option>
      <option value="contrast">常識・思い込み反転型</option><option value="check">チェックリスト型</option>
      <option value="story">ストーリー型</option><option value="pro">プロ解説型</option>
    </select>
    <label>撮影できる素材</label>
    <input id="assets" placeholder="例：モデルハウス、スタッフ、地図、PC、カタログ">
    <label>締め方</label>
    <select id="cta"><option value="none">CTAなし</option><option value="soft" selected>自然な相談誘導</option><option value="profile">プロフィール誘導</option><option value="next">次回予告</option></select>
    <div class="actions"><button class="secondary" onclick="autoPick()">参考情報を自動選択</button></div>
    <button class="primary" onclick="generate()">台本を作成</button>
    <p class="tiny">※ 数値・保証・補助金・価格・エリアなどの変動情報は「要確認」を表示します。</p>
  </div>

  <div class="card">
    <h2>参考にする会社情報</h2>
    <div id="knowledgePick"><p class="muted">テーマを入力して「参考情報を自動選択」を押してください。</p></div>
  </div>
  <div class="card">
    <h2>参考にする過去台本</h2>
    <div id="pastPick"><p class="muted">テーマに近い過去台本を自動選択します。</p></div>
  </div>
</aside>

<section>
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="result">完成台本</button>
      <button class="tab" data-tab="refs">参照情報</button>
      <button class="tab" data-tab="ai">AIで仕上げる</button>
      <button class="tab" data-tab="db">資料DB</button>
    </div>
    <div id="result" class="pane active"><div class="empty">左側にテーマを入れて「台本を作成」を押してください。</div></div>
    <div id="refs" class="pane"><div class="empty">まだ参照情報はありません。</div></div>
    <div id="ai" class="pane"><div class="empty">台本を作成すると、ChatGPT / Claudeへ渡せる仕上げ用プロンプトが出ます。</div></div>
    <div id="db" class="pane"></div>
  </div>
</section>
</main>

{id:'qa_interior2',cat:'リフォーム・インテリア',title:'他社で建てた家のインテリア相談',text:'実際の住まいへ訪問して現地調査を行い、部屋の寸法、既存家具の色味、生活動線などを確認したうえで、家具のサイズ感やレイアウトを提案すると記載。',source:'添付Q&A資料',verified:false},
{id:'qa_visual1',cat:'設計・デザイン',title:'完成イメージを見える化',text:'図面だけでは分かりにくい実際の広さや雰囲気を、パースや一棟ごとのデザイン提案などで確認しやすくする。',source:'添付Q&A資料',verified:false},
{id:'qa_price1',cat:'品質・価格',title:'建築費用の目安（社内Q&A）',text:'延床面積や仕様で異なるが、社内Q&Aには平均的な坪単価70〜80万円程度（税込）の記載がある。住まいの形状や採用設備で変動するため、現行価格としては必ず確認する。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_subsidy1',cat:'制度・キャンペーン',title:'補助金・助成金の活用',text:'国や自治体の住宅関連補助金等について、対象制度を確認し、申請手続きもサポートする旨の記載。制度は年度で変わるため必ず最新確認する。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_loan1',cat:'住宅ローン',title:'住宅ローン相談・資金計画',text:'提携銀行の紹介やライフプランに合わせた借入計画のシミュレーションをサポートする。',source:'添付Q&A資料',verified:false},
{id:'qa_loan2',cat:'住宅ローン',title:'単身者の住宅ローン',text:'単身でも住宅ローン相談は可能。無理のない返済計画を立てるため、資金計画を丁寧に相談すると記載。',source:'添付Q&A資料',verified:false},
{id:'qa_loan3',cat:'住宅ローン',title:'自己資金ゼロの場合',text:'自己資金がゼロでも住宅ローンを組める場合はあるが、一般的には諸費用分の現金があると選択肢が広がる。貯蓄状況に合わせて資金計画を個別提案する。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_loan4',cat:'住宅ローン',title:'他の借入がある場合',text:'車のローンやカードのリボ払いなどがある場合も住宅ローンを検討できるケースはあるが、現在の債務状況に合わせて返済計画を立てる必要がある。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_contract1',cat:'品質・価格',title:'契約後の追加費用',text:'契約時のプラン内容に変更がなければ原則追加費用は発生しない旨の記載。ただし着工後の仕様変更やオプション追加、地盤調査結果によって別途費用が発生する場合がある。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_pet1',cat:'設計・デザイン',title:'ペットと暮らす家',text:'ペットと一緒に住みたい場合、ペットに合わせた素材選びや間取りの工夫を提案すると記載。',source:'添付Q&A資料',verified:false},
{id:'qa_compact1',cat:'設計・デザイン',title:'平屋・コンパクトな家',text:'平屋やコンパクトな住まいにも対応し、敷地条件や暮らし方に合わせて無駄の少ないプランを提案する。',source:'添付Q&A資料',verified:false},
{id:'qa_garage1',cat:'設計・デザイン',title:'ガレージハウス',text:'車やバイクを楽しむ暮らしに合わせたガレージハウスにも対応すると記載。',source:'添付Q&A資料',verified:false},
{id:'qa_barrier1',cat:'設計・デザイン',title:'バリアフリー設計',text:'将来の暮らし方も見据え、段差や動線などに配慮したバリアフリー設計に対応すると記載。',source:'添付Q&A資料',verified:false},
{id:'qa_structure1',cat:'性能',title:'耐震等級3（社内Q&A）',text:'社内Q&Aでは耐震性能の最高等級である耐震等級3を全棟で実現すると記載。揺れを軽減する制振ダンパーもオプション提案可能。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_insulation1',cat:'性能',title:'断熱性能 UA値0.46（社内Q&A）',text:'断熱材やサッシの選定により、UA値0.46を実現すると社内Q&Aに記載。モデルプランによる計測値との注記あり。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_termite1',cat:'保証・メンテ',title:'シロアリ対策',text:'シロアリに強い樹種、基礎パッキン工法による床下通気、人体に配慮した薬剤による防蟻処理を標準施工し、5年ごとの保証・点検制度を整えている旨の記載。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_maint1',cat:'保証・メンテ',title:'メンテナンスの目安',text:'10〜15年ごとの外壁・屋根の点検や塗装、防蟻処理の更新を推奨。耐久性の高い素材を使い、将来のメンテナンスコストを抑える工夫を行う。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_equipment1',cat:'保証・メンテ',title:'設備交換の目安',text:'給湯器などの設備更新は15年前後で発生することがあるため、初期段階で耐久性の高い素材を提案し、長期的なコスト管理をサポートする。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_warranty1',cat:'保証・メンテ',title:'保証・定期点検（社内Q&A）',text:'住宅瑕疵担保責任保険10年に加え独自の長期保証制度、お引渡し後2年間で3回の定期巡回、その後5年ごとの定期点検サービス等の記載がある。手書き修正もあるため、保証期間・無償範囲は公開前に最新確認必須。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_referral1',cat:'制度・キャンペーン',title:'オーナー紹介制度（社内Q&A）',text:'社内Q&Aには、紹介者へ10万円分の商品券、紹介先へ10万円分のWOODY HOUSE取扱商品を贈る旨の記載がある。適用条件・金額は変動可能性が高いため投稿前に必ず最新確認する。',source:'添付Q&A資料',verified:false,verify:true},
{id:'qa_meeting1',cat:'相談・サポート',title:'打ち合わせ回数',text:'外観・間取り・内装・コーディネート・電気配線・コンセント配置など、納得できるまで丁寧に進める旨の記載。回数を固定せず内容に応じて進行する。',source:'添付Q&A資料',verified:false},
{id:'qa_owneritem1',cat:'設計・デザイン',title:'オーナー支給',text:'一部設備についてオーナー支給に対応可能とする記載がある。対象・条件は商品や施工条件で異なるため事前確認が必要。',source:'添付Q&A資料',verified:false,verify:true},
];

function words(s){
  let x=String(s||'').toLowerCase().replace(/[、。！？!?・（）()「」『』]/g,' ');

function scoreText(query,text){

  const q=(document.getElementById('theme').value+' '+document.getElementById('must').value).trim();
  let klist=KB.map(x=>[x,kbScore(x,q)]).sort((a,b)=>b[1]-a[1]).slice(0,12);
  document.getElementById('knowledgePick').innerHTML=klist.map(([x,s])=>`<label class="source"><input type="checkbox" ${selectedKB.has(x.id)?'checked':''} onchange="toggleKB('${x.id}',this.checked)"><div><b>${esc(x.title)}</b><div><span class="badge">${esc(x.cat)}</span><span class="badge">${esc(x.source)}</span>${x.verify?'<span class="badge warn">要確認</span>':''}</div><p>${esc(x.text)}</p></div></label>`).join('')||'<p class="muted">該当候補なし</p>';
  let plist=PAST.map((x,i)=>[i,x,pastScore(x,q)]).sort((a,b)=>b[2]-a[2]).slice(0,7);
  document.getElementById('pastPick').innerHTML=plist.map(([i,x,s])=>`<label class="source"><input type="checkbox" ${selectedPast.has(i)?'checked':''} onchange="togglePast(${i},this.checked)"><div><b>${esc(x.title)}</b><p>${esc(x.rows.slice(0,5).map(r=>r.telop).filter(Boolean).join(' → '))}</p></div></label>`).join('');
}
function toggleKB(id,v){v?selectedKB.add(id):selectedKB.delete(id)}
function togglePast(i,v){v?selectedPast.add(i):selectedPast.delete(i)}
function shortFact(t,max=36){
  t=String(t||'').replace(/と記載。?/g,'').replace(/旨の記載。?/g,'').replace(/する。$/,'');
  const parts=t.split(/[。]/).filter(Boolean);
  return (parts[0]||t).slice(0,max);
}
function genericVisual(i,assets,past){
  const a=(assets||'').split(/[、,]/).map(x=>x.trim()).filter(Boolean);
  const pv=past.flatMap(x=>x.rows.map(r=>r.visual)).filter(x=>x&&x!=='ー');
  const pool=[...a,...pv,'スタッフがカメラに向かって説明','カタログ・資料の手元','モデルハウスの生活カット'];
  return pool[i%pool.length]||'スタッフが説明';
}
function hookFor(angle,theme){
  const hooks={
    qa:[`${theme}、結局どうなの？`,`${theme}でよく聞かれる質問です`],
    avoid:[`${theme}で後悔する人、ここを見落としがちです`,`${theme}、先にこれを知らないと後悔するかも`],
    contrast:[`${theme}、実は「普通」に合わせなくていいです`,`${theme}で大事なのは、そこじゃありません`],
    check:[`${theme}で確認したいポイント、3つです`,`${theme}、まずこの3つをチェック`],
    story:[`${theme}がイメージできない方へ`,`${theme}、実際に見て初めて分かることがあります`],
    pro:[`${theme}、住宅会社目線でシンプルに解説します`,`${theme}で迷ったら、まずここを見てください`]
  }; return hooks[angle]?.[0]||hooks.pro[0];
}
function splitIntoCuts(text,max=18){
  text=String(text||'').trim(); if(!text)return[];
  const seg=text.split(/[、。]/).filter(Boolean);
  let out=[];
  seg.forEach(s=>{s=s.trim();while(s.length>max){let cut=Math.min(max,s.length);out.push(s.slice(0,cut));s=s.slice(cut)}if(s)out.push(s)});
  return out;
}
function roleFor(i,total){if(i===0)return'フック';if(i<=2)return'続きを見る理由';if(i<total-3)return'情報・根拠';if(i===total-3)return'まとめ';return'締め'}
function generate(){
  const theme=document.getElementById('theme').value.trim();
  if(!theme){alert('テーマを入力してください');return}
  if(!selectedKB.size&&!selectedPast.size)autoPick();
  const must=document.getElementById('must').value.trim();
  const target=document.getElementById('target').value;
  let angle=document.getElementById('angle').value;if(angle==='auto')angle=autoAngle(theme+' '+must);
  const assets=document.getElementById('assets').value;
  const cta=document.getElementById('cta').value;
  const maxCuts=Number(document.getElementById('duration').value);
  const kb=chosenKB(), past=chosenPast();
  const cuts=[];
  cuts.push({telop:hookFor(angle,theme),voice:hookFor(angle,theme).replace(/[！？?]/g,''),visual:genericVisual(0,assets,past)});
  const bridge=angle==='avoid'?'知らずに進めると、あとで「想定と違った」になりやすいです':angle==='qa'?'結論から言うと、条件によって変わるのでポイントを分けて見ます':angle==='check'?'難しく考えず、この順番で見れば大丈夫です':angle==='contrast'?'数字や見た目だけで決める前に、暮らし方から考えるのがポイントです':'まず、判断材料を整理すると分かりやすいです';
  splitIntoCuts(bridge).slice(0,2).forEach((x,j)=>cuts.push({telop:x,voice:x,visual:genericVisual(j+1,assets,past)}));
  if(must){
    splitIntoCuts(must,22).slice(0,3).forEach((x,j)=>cuts.push({telop:x,voice:x,visual:genericVisual(j+3,assets,past)}));
  }
  const facts=kb.slice(0,6).map(x=>({x,text:shortFact(x.text,46)}));
  facts.forEach((f,j)=>{
    let pieces=splitIntoCuts(f.text,22).slice(0,2);
    pieces.forEach((p,k)=>cuts.push({telop:p,voice:p,visual:genericVisual(j+k+5,assets,past),source:f.x.title,verify:!!f.x.verify}));
  });
  if(cuts.length<8&&past.length){
    const usable=past[0].rows.map(r=>r.telop).filter(x=>x&&x.length<30).slice(4,9);
    usable.forEach((x,j)=>cuts.push({telop:x,voice:x,visual:genericVisual(j+8,assets,past)}));
  }
  cuts.push({telop:'大事なのは、自分たちの条件で確認すること',voice:'大事なのは、自分たちの条件に当てはめて確認することです',visual:genericVisual(15,assets,past)});
  if(cta==='soft')cuts.push({telop:'迷っていることがあれば、まず整理するところから',voice:'まだ具体的に決まっていなくても、気になることから整理できます',visual:genericVisual(16,assets,past)});
  if(cta==='profile')cuts.push({telop:'家づくり相談はプロフィールから',voice:'家づくりについて相談したい方は、プロフィールのリンクからご確認ください',visual:'Instagramプロフィール画面'});
  if(cta==='next')cuts.push({telop:'次回も家づくりの疑問を解説します',voice:'次回も家づくりでよくある疑問を分かりやすく解説します',visual:'ロゴ・次回予告'});
  let finalCuts=cuts.slice(0,maxCuts).map((c,i)=>({...c,cut:i+1,role:roleFor(i,Math.min(cuts.length,maxCuts))}));
  const verify=kb.filter(x=>x.verify);
  lastDraft={theme,target,angle,kb,past,cuts:finalCuts,verify,must,assets,cta};
  renderResult();renderRefs();renderAI();
  showTab('result');
}
function renderResult(){
  const d=lastDraft;if(!d)return;
  const rows=d.cuts.map(c=>`<tr><td class="cut">${c.cut}</td><td>${esc(c.telop)}${c.verify?'<br><span class="badge warn">要確認情報を含む</span>':''}</td><td>${esc(c.voice)}</td><td>${esc(c.visual)}</td><td class="role">${esc(c.role)}</td></tr>`).join('');
  const warning=d.verify.length?`<div class="verify"><b>公開前に確認</b><br>${d.verify.map(x=>'・'+esc(x.title)).join('<br>')}</div>`:'';
  document.getElementById('result').innerHTML=`<div class="stats"><span class="stat">テーマ：${esc(d.theme)}</span><span class="stat">見せ方：${esc(angleName(d.angle))}</span><span class="stat">CUT：${d.cuts.length}</span></div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>CUT</th><th>▼テロップ</th><th>▼アフレコ</th><th>▼撮影素材</th><th>役割</th></tr></thead><tbody>${rows}</tbody></table></div>${warning}<div class="actions"><button onclick="copyDraft()">台本をコピー</button></div>`;
}
function angleName(a){return({qa:'Q&A型',avoid:'失敗回避型',contrast:'思い込み反転型',check:'チェックリスト型',story:'ストーリー型',pro:'プロ解説型'})[a]||a}
function renderRefs(){
  const d=lastDraft;if(!d)return;
  document.getElementById('refs').innerHTML=`<h3>事実の根拠（Q&A / 公式HP）</h3>${d.kb.map(x=>`<div class="refrow"><b>${esc(x.title)}</b> <span class="badge">${esc(x.source)}</span>${x.verify?'<span class="badge warn">要確認</span>':''}<br><span class="muted">${esc(x.text)}</span></div>`).join('')||'<p class="muted">なし</p>'}<h3>書き方の参考（過去台本）</h3>${d.past.map(x=>`<div class="refrow"><b>${esc(x.title)}</b><br><span class="muted">${esc(x.rows.slice(0,7).map(r=>r.telop).filter(Boolean).join(' → '))}</span></div>`).join('')||'<p class="muted">なし</p>'}<h3>編集ルール</h3><div class="box">${esc(CORRECTIONS.filter(x=>x.issue).slice(0,10).map(x=>'・'+x.issue+(x.improvement?' → '+x.improvement:'')).join('\n'))}</div>`;
}
function buildPrompt(){
  const d=lastDraft;
  const refScripts=d.past.map(x=>`【過去台本：${x.title}】\n${x.rows.slice(0,18).map(r=>`${r.cut}. テロップ:${r.telop} / アフレコ:${r.voice} / 撮影:${r.visual}`).join('\n')}`).join('\n\n');
  const facts=d.kb.map(x=>`- [${x.source}${x.verify?'・要確認':''}] ${x.title}: ${x.text}`).join('\n');
  const draft=d.cuts.map(c=>`${c.cut}. テロップ:${c.telop} / アフレコ:${c.voice} / 撮影:${c.visual}`).join('\n');
  return `あなたは住宅会社WOODY HOUSEのInstagramリール台本編集者です。
以下の「事実データ」と「過去台本の書き方」を使い、現在のたたき台を実務で使えるレベルに仕上げてください。

【役割分担】
- Q&A・公式HP = WHAT（会社固有の事実）。ここにない会社固有情報は創作しない。
- 過去台本 = HOW（テンポ、CUTの刻み方、言い回し、撮影素材の考え方）。古い数値を事実として再利用しない。
- 数値、価格、保証、補助金、施工エリア、キャンペーン等で「要確認」の情報は断定しない。

【今回】
テーマ：${d.theme}
ターゲット：${d.target}
見せ方：${angleName(d.angle)}
必須内容：${d.must||'特になし'}
撮影素材：${d.assets||'指定なし'}

【会社情報】
${facts}

【過去台本】
${refScripts}

【現在のたたき台】
${draft}

【過去の修正方針】
${CORRECTIONS.map(x=>'- '+x.issue+(x.improvement?' → '+x.improvement:'')).join('\n')}

【仕上げルール】
- 冒頭3秒を強くする。ただし煽りすぎない。
- 1 CUT 1メッセージ。
- テロップを短くする。
- アフレコは資料の読み上げではなく自然な話し言葉。
- 情報価値を先に置き、会社紹介・CTAは後半。
- 商業臭を抑える。
- 同じ意味を引き伸ばさない。
- 撮影しやすい素材にする。
- 誤字脱字を確認。
- 最後に「公開前に確認すべき事実」を列挙。

出力は「CUT / テロップ / アフレコ / 撮影素材」の表形式で。`;
}
function renderAI(){
  document.getElementById('ai').innerHTML=`<p class="muted">ローカルで作ったたたき台を、ChatGPTやClaudeにこのプロンプトごと渡すと、会社情報と過去台本を踏まえて仕上げられます。</p><textarea id="aiPrompt" style="min-height:520px">${esc(buildPrompt())}</textarea><div class="actions"><button onclick="copyPrompt()">AI用プロンプトをコピー</button></div>`;
}
function copyDraft(){
  const d=lastDraft;if(!d)return;
  const t=d.cuts.map(c=>`CUT ${c.cut}\nテロップ：${c.telop}\nアフレコ：${c.voice}\n撮影素材：${c.visual}`).join('\n\n');
  navigator.clipboard.writeText(t);alert('台本をコピーしました');
}
function copyPrompt(){navigator.clipboard.writeText(buildPrompt());alert('AI用プロンプトをコピーしました')}
function renderDB(){
  const cats=[...new Set(KB.map(x=>x.cat))];
  document.getElementById('db').innerHTML=`<div class="stats"><span class="stat">会社情報 ${KB.length}件</span><span class="stat">過去台本 ${PAST.length}本</span><span class="stat">編集指摘 ${CORRECTIONS.length}件</span></div>`+cats.map(cat=>`<h3>${esc(cat)}</h3>${KB.filter(x=>x.cat===cat).map(x=>`<div class="refrow"><b>${esc(x.title)}</b> <span class="badge">${esc(x.source)}</span>${x.verify?'<span class="badge warn">要確認</span>':''}<br><span class="muted">${esc(x.text)}</span></div>`).join('')}`).join('')+`<h3>過去台本</h3>${PAST.map(x=>`<div class="refrow"><b>${esc(x.title)}</b> <span class="badge">${esc(x.sheet)}</span></div>`).join('')}`;
}
function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===id))}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>showTab(x.dataset.tab));
['theme','must'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(document.getElementById('theme').value.trim())renderPicks()}));
renderDB();
</script>
</body>
</html>
